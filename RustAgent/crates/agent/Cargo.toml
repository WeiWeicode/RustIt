[package]
name = "rustit-agent"
version = "0.1.0"
edition = "2024"
description = "GigaNexus 端點 Agent:蒐集資產 → HTTPS 回報、一條 WebSocket 心跳(RustIt INTEGRATION-PLAN M2)"

[dependencies]
rustit-collector = { path = "../collector" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# HTTP 與 WebSocket 共用同一個 rustls::ClientConfig(ENDPOINT-AGENT-GUIDE §3.4、§6.2);不使用 native-tls(私鑰必須可匯出)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2.5"
url = "2.5"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
# 契約測試:以 RustIt/docs/contracts 的 JSON Schema 驗證 Agent 送出的 JSON(AGENT.md §7.3)
jsonschema = { version = "0.58", default-features = false }
