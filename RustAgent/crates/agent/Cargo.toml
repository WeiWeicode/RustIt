[package]
name = "rustit-agent"
version = "0.7.0"
edition = "2024"
description = "GigaNexus 端點 Agent:蒐集資產 → HTTPS 回報、一條 WebSocket 心跳;本機加密暫存與離線補傳;固定類型指令;心跳附健康摘要;本機管道與看守 Watchdog;升級時配合 Watchdog 停止(prepare_shutdown、agent.upgrade);前景或 Windows 服務執行(RustIt PLATFORM-PLAN P1、P2、P4、P5、P6)"

[dependencies]
rustit-collector = { path = "../collector" }
# 設定、憑證與連線、退避、信封、停止訊號、檔案日誌、路徑(與 Watchdog 共用,PLATFORM-PLAN §3.1)
rustit-common = { path = "../common" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.10"
uuid = { version = "1.28.0", features = ["v4"] }
# 指令 logs.collect:日誌壓成 zip 上傳(P4-2,需求方 2026-10-15 同意);只用 deflate(純 Rust zlib-rs),不含 zopfli 與其他壓縮法
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# 測試用壞版本(P6-UPGRADE-DESIGN §0 完成標準「故意放壞的版本 → 自動還原」;只用於 VM 驗收,不可發佈到 it / all 環)
# broken-exit:啟動即結束;broken-no-ws:不連 WebSocket(管道正常)
broken-exit = []
broken-no-ws = []

[build-dependencies]
# exe 版本資源(ProductVersion):Watchdog 升級前比對下載檔的版本(P6-UPGRADE-DESIGN §8.2);已在 Cargo.lock(Tauri 用),不另下載
embed-resource = "3.0.11"

[dev-dependencies]
# 契約測試:以 RustIt/docs/contracts 的 JSON Schema 驗證 Agent 送出的 JSON(AGENT.md §7.3)
jsonschema = { version = "0.58", default-features = false }
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
# Windows 服務:SCM 進入點、安裝與失敗復原設定(PLATFORM-PLAN §4.1、指南 §6.1)
windows-service = "0.8.1"
# 指令 message.show:WTSSendMessage 送到主控台工作階段(P4)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
