[package]
name = "rustit-demo"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
rustit-collector = { version = "0.1.0", path = "../collector" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39"
tauri = { version = "2.12", features = ["custom-protocol"] }
tokio = { version = "1.53.1", features = ["time"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com"] }
