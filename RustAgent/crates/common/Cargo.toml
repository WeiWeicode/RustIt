[package]
name = "rustit-common"
version = "0.1.0"
edition = "2024"
description = "RustIt 端點服務共用(Agent、Watchdog):設定、憑證與連線、退避、信封、停止訊號、檔案日誌、路徑、服務控制與本機管道(PLATFORM-PLAN §3.1)"

[dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
# HTTP 與 WebSocket 共用同一個 rustls::ClientConfig(ENDPOINT-AGENT-GUIDE §3.4、§6.2);不使用 native-tls(私鑰必須可匯出)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2.5"
url = "2.5"
log = "0.4"
# 挑選裝置憑證時解析效期與 EKU(指南 §3.4)
x509-parser = "0.18.1"

[dev-dependencies]
# 產生測試用憑證(挑選規則測試;不提交任何真實憑證)
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# 暫停時間的測試(結束寬限)
tokio = { version = "1.53", features = ["test-util", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
# Windows 憑證存放區:私鑰留在 CNG 內簽章(不可匯出也能用,指南 §3.4);用 ring 以免建置需要 CMake / NASM
rustls-cng = { version = "0.7.1", default-features = false, features = ["ring", "tls12", "logging"] }
# Agent 與 Watchdog 互相看守:查詢 / 啟動 / 停止對方服務、失敗復原、服務 ACL、本機具名管道(P5-2,指南 §7);
# 升級:Authenticode(WinTrust)、磁碟剩餘空間與 exe 版本資源(FileSystem)(P6-2)
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
